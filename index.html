<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHONISTIC — Smart shopping. Simple choice.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .top {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tagline {
      font-size: 11px;
      color: #777;
    }

    .search {
      flex: 1;
      display: flex;
      background: #f1f1f1;
      border-radius: 25px;
      overflow: hidden;
    }

    .search input {
      flex: 1;
      border: none;
      outline: none;
      padding: 13px 18px;
      background: transparent;
      font-size: 15px;
    }

    .search button {
      border: none;
      background: #111;
      color: white;
      padding: 0 20px;
      cursor: pointer;
    }

    .icons {
      display: flex;
      gap: 15px;
      font-size: 22px;
    }

    .icon-btn {
      border: none;
      background: none;
      cursor: pointer;
      position: relative;
    }

    .count {
      position: absolute;
      top: -7px;
      right: -7px;
      background: #e53935;
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .categories {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 13px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .categories button {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .categories button:hover {
      background: #111;
      color: white;
    }

    .hero {
      max-width: 1200px;
      margin: 20px auto;
      padding: 45px 30px;
      border-radius: 18px;
      background: linear-gradient(120deg,#111,#333);
      color: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ddd;
      margin-bottom: 20px;
    }

    .hero button {
      border: none;
      background: white;
      color: #111;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .section {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 24px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      position: relative;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .product-image {
      height: 210px;
      background: #f4f4f4;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      font-size: 40px;
      color: #aaa;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .product-info {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .buy {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .buy:hover {
      background: #333;
    }

    .heart {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      background: white;
      cursor: pointer;
      font-size: 18px;
    }

    .badge {
      position: absolute;
      left: 15px;
      top: 15px;
      background: #e53935;
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
    }

    .loading {
      grid-column: 1/-1;
      text-align: center;
      padding: 50px;
      color: #777;
    }

    footer {
      background: #111;
      color: white;
      margin-top: 50px;
      padding: 35px 20px;
      text-align: center;
    }

    footer p {
      color: #aaa;
      margin-top: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
      padding: 13px 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty button {
      width: 27px;
      height: 27px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove {
      border: none;
      background: none;
      color: #e53935;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 20px;
      margin: 20px 0;
    }

    .checkout-btn {
      width: 100%;
      background: #111;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media(max-width:900px) {
      .products {
        grid-template-columns: repeat(3,1fr);
      }

      .tagline {
        display: none;
      }
    }

    @media(max-width:650px) {
      .top {
        flex-wrap: wrap;
      }

      .logo {
        width: 100%;
      }

      .search {
        order: 3;
        width: 100%;
        flex-basis: 100%;
      }

      .products {
        grid-template-columns: repeat(2,1fr);
        gap: 12px;
      }

      .product {
        padding: 10px;
      }

      .product-image {
        height: 170px;
      }

      .hero {
        margin: 15px;
        padding: 30px 20px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .section {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div>
      <div class="logo">PHONISTIC</div>
      <div class="tagline">Smart shopping. Simple choice.</div>
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Search iPhones, cases, chargers..."
      >
      <button onclick="searchProducts()">Search</button>
    </div>

    <div class="icons">
      <button class="icon-btn" onclick="openCart()">
        🛒
        <span class="count" id="cartCount">0</span>
      </button>
    </div>

  </div>

  <div class="categories">
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('iphone')">iPhones</button>
    <button onclick="filterCategory('airpods')">AirPods</button>
    <button onclick="filterCategory('case')">Cases</button>
    <button onclick="filterCategory('charger')">Chargers</button>
    <button onclick="filterCategory('power bank')">Power Banks</button>
    <button onclick="filterCategory('accessories')">Accessories</button>
  </div>
</header>

<section class="hero">
  <h1>Upgrade your everyday.</h1>
  <p>Shop iPhones and accessories at PHONISTIC.</p>
  <button onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">
    Shop Now
  </button>
</section>

<section class="section" id="productsSection">

  <div class="section-title">
    <h2>Hot Deals</h2>
    <span id="productStatus"></span>
  </div>

  <div class="products" id="products">
    <div class="loading">Loading products...</div>
  </div>

</section>

<footer>
  <h2>PHONISTIC</h2>
  <p>Smart shopping. Simple choice.</p>
  <p>© 2026 PHONISTIC. All rights reserved.</p>
</footer>


<!-- CART MODAL -->

<div class="modal" id="cartModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Your Cart</h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">₦0</span>
    </div>

    <button class="checkout-btn" onclick="openCheckout()">
      Proceed to Checkout
    </button>

  </div>

</div>


<!-- CHECKOUT MODAL -->

<div class="modal" id="checkoutModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Checkout</h2>
      <button class="close" onclick="closeCheckout()">×</button>
    </div>

    <form id="checkoutForm">

      <div class="form-group">
        <label>Full Name</label>
        <input id="fullName" type="text" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input id="phone" type="tel" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input id="email" type="email">
      </div>

      <div class="form-group">
        <label>Delivery Address</label>
        <textarea id="address" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label>State</label>

        <select id="state" required>
          <option value="">Select state</option>
          <option>Kano</option>
          <option>Kaduna</option>
          <option>Abuja FCT</option>
          <option>Lagos</option>
          <option>Rivers</option>
          <option>Oyo</option>
          <option>Plateau</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Delivery Method</label>

        <select id="deliveryMethod" required>
          <option value="Delivery">Delivery</option>
          <option value="Pickup">Pickup</option>
        </select>
      </div>

      <button class="checkout-btn" type="submit">
        Place Order
      </button>

    </form>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://irdqazkxbinwcorvfwjg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable__irFocXiCfSKi-0uO4Wlcg_-CKO8B8S";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let products = [];
let cart = JSON.parse(localStorage.getItem("phonistic_cart")) || [];


/* LOAD PRODUCTS FROM SUPABASE */

async function loadProducts() {

  const container = document.getElementById("products");

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("id", { ascending: true });

  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="loading">Unable to load products.</div>';

    return;
  }

  products = data || [];

  displayProducts(products);
}


/* DISPLAY PRODUCTS */

function displayProducts(items) {

  const container = document.getElementById("products");

  if (!items.length) {

    container.innerHTML =
      '<div class="loading">No products found.</div>';

    return;
  }

  container.innerHTML = "";

  items.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";

    card.dataset.category =
      (product.category || "").toLowerCase();

    card.innerHTML = `

      <div class="badge">HOT</div>

      <button class="heart"
        onclick="toggleWishlist(${product.id})">
        ♡
      </button>

      <div class="product-image">

        ${
          product.image_url

          ? `<img src="${product.image_url}" alt="${product.name}">`

          : `<div class="placeholder">📱</div>`
        }

      </div>

      <h3>${product.name}</h3>

      <div class="product-info">
        ${product.storage || ""}
        ${product.colour ? " · " + product.colour : ""}
      </div>

      <div class="price">
        ₦${Number(product.price).toLocaleString("en-NG")}
      </div>

      <button class="buy"
        onclick="addToCart(${product.id})">
        Add to Cart
      </button>
    `;

    container.appendChild(card);

  });

}


/* CART */

function addToCart(productId) {

  const product = products.find(
    p => p.id === productId
  );

  if (!product) return;

  const existing = cart.find(
    item => item.id === productId
  );

  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price),
      storage: product.storage,
      colour: product.colour,
      quantity: 1
    });

  }

  saveCart();

  updateCartCount();

  alert(product.name + " added to cart.");
}


function saveCart() {

  localStorage.setItem(
    "phonistic_cart",
    JSON.stringify(cart)
  );

}


function updateCartCount() {

  const count = cart.reduce(
    (total, item) => total + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent =
    count;

}


function openCart() {

  renderCart();

  document
    .getElementById("cartModal")
    .classList.add("active");

}


function closeCart() {

  document
    .getElementById("cartModal")
    .classList.remove("active");

}


function renderCart() {

  const container =
    document.getElementById("cartItems");

  if (!cart.length) {

    container.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    document.getElementById("cartTotal").textContent =
      "₦0";

    return;
  }

  container.innerHTML = "";

  let total = 0;

  cart.forEach(item => {

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div class="cart-item-info">

        <strong>${item.name}</strong>

        <small>
          ${item.storage || ""}
          ${item.colour ? " · " + item.colour : ""}
        </small>

        <div>
          ₦${item.price.toLocaleString("en-NG")}
        </div>

      </div>

      <div class="qty">

        <button onclick="changeQuantity(${item.id}, -1)">
          −
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQuantity(${item.id}, 1)">
          +
        </button>

      </div>

      <button class="remove"
        onclick="removeFromCart(${item.id})">
        Remove
      </button>
    `;

    container.appendChild(div);

  });

  document.getElementById("cartTotal").textContent =
    "₦" + total.toLocaleString("en-NG");

}


function changeQuantity(productId, change) {

  const item =
    cart.find(item => item.id === productId);

  if (!item) return;

  item.quantity += change;

  if (item.quantity <= 0) {

    cart =
      cart.filter(item => item.id !== productId);

  }

  saveCart();

  updateCartCount();

  renderCart();

}


function removeFromCart(productId) {

  cart =
    cart.filter(item => item.id !== productId);

  saveCart();

  updateCartCount();

  renderCart();

}


/* SEARCH */

function searchProducts() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(product => {

      const text = (

        product.name +
        " " +
        (product.storage || "") +
        " " +
        (product.colour || "") +
        " " +
        (product.category || "")

      ).toLowerCase();

      return text.includes(search);

    });

  displayProducts(filtered);

}


document
  .getElementById("searchInput")
  .addEventListener("keyup", function(event) {

    if (event.key === "Enter") {

      searchProducts();

    }

  });


/* CATEGORY FILTER */

function filterCategory(category) {

  if (category === "all") {

    displayProducts(products);

    return;

  }

  const filtered =
    products.filter(product => {

      const productCategory =
        (product.category || "").toLowerCase();

      return productCategory.includes(
        category.toLowerCase()
      );

    });

  displayProducts(filtered);

}


/* WISHLIST */

function toggleWishlist(productId) {

  const saved =
    JSON.parse(
      localStorage.getItem("phonistic_wishlist")
    ) || [];

  if (saved.includes(productId)) {

    const index =
      saved.indexOf(productId);

    saved.splice(index, 1);

    alert("Removed from wishlist.");

  } else {

    saved.push(productId);

    alert("Added to wishlist.");

  }

  localStorage.setItem(
    "phonistic_wishlist",
    JSON.stringify(saved)
  );

}


/* CHECKOUT */

function openCheckout() {

  if (!cart.length) {

    alert("Your cart is empty.");

    return;

  }

  closeCart();

  document
    .getElementById("checkoutModal")
    .classList.add("active");

}


function closeCheckout() {

  document
    .getElementById("checkoutModal")
    .classList.remove("active");

}


/* PLACE ORDER */

document
  .getElementById("checkoutForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!cart.length) {

      alert("Your cart is empty.");

      return;

    }

    const fullName =
      document.getElementById("fullName").value;

    const phone =
      document.getElementById("phone").value;

    const email =
      document.getElementById("email").value;

    const address =
      document.getElementById("address").value;

    const state =
      document.getElementById("state").value;

    const deliveryMethod =
      document.getElementById("deliveryMethod").value;


    const subtotal =
      cart.reduce(
        (sum, item) =>
          sum + item.price * item.quantity,
        0
      );


    const deliveryFee =
      deliveryMethod === "Pickup"
        ? 0
        : 3000;


    const total =
      subtotal + deliveryFee;


    /*
      ORDER DATABASE CONNECTION
      WILL BE SECURED IN THE NEXT STEP.
    */

    alert(
      "Checkout details received.\n\n" +
      "Total: ₦" +
      total.toLocaleString("en-NG") +
      "\n\nYour order system is being connected."
    );

  });


/* INITIALIZE */

updateCartCount();

loadProducts();

</script>

</body>
</html>
